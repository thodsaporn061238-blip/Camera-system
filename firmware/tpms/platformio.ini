; โปรแกรมจอแสดงลมยาง (TPMS) สำหรับบอร์ด ESP32-2432S028 (จอเหลือง 2.8 นิ้ว)
; สร้างไฟล์: cd firmware/tpms && ../../tools/gen_fonts.sh && pio run

[env:cyd]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
board_build.filesystem = littlefs
; หน้าจอเริ่มต้นฝังมากับโปรแกรม (ไฟล์เดียวกับแม่แบบบนหน้าเว็บ)
board_build.embed_txtfiles = layouts/default.json
monitor_speed = 115200
lib_deps =
    lvgl/lvgl@8.3.11
    bodmer/TFT_eSPI@2.5.43
    ; คลังของ PlatformIO ไม่มีเวอร์ชัน 1.4 จึงดึงจาก GitHub ที่ป้าย v1.4 โดยตรง
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#d57f64c8b5f2bc5b8d10d121550806eeff7b06d9
    h2zero/NimBLE-Arduino@1.4.3
    bblanchon/ArduinoJson@7.2.1
build_flags =
    -Os
    -D LV_CONF_INCLUDE_SIMPLE
    -I include
    ; ขาจอ ILI9341 ของบอร์ด ESP32-2432S028
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D USE_HSPI_PORT=1
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D SPI_FREQUENCY=55000000
    -D SPI_READ_FREQUENCY=20000000
    -D SPI_TOUCH_FREQUENCY=2500000
